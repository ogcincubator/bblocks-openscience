$schema: https://json-schema.org/draft/2020-12/schema
description: Schema for EarthCODE Workflow
allOf:
- $ref: https://ogcincubator.github.io/geodcat-ogcapi-records/build/annotated/geo/geodcat/geodcat-records/schema.yaml
properties:
  properties:
    type: object
    anyOf:
    - $ref: https://ogcincubator.github.io/bblock-prov-schema/build/annotated/ogc-utils/prov-entity/schema.yaml
    - not:
        required:
        - provType
    required:
    - osc:project
    properties:
      osc:project:
        $ref: https://ogcincubator.github.io/bblocks-openscience/build/annotated/osc/prov-examples/geodcat-stac-earthcode/common/schema.yaml#/$defs/osc:project
      wfdesc:hasInput:
        type: object
        additionalProperties:
          type: object
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/inputDescription/schema.yaml
      wfdesc:hasOutput:
        type: object
        additionalProperties:
          type: object
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/outputDescription/schema.yaml
  links:
    type: array
    items:
      oneOf:
      - title: Other Link
        properties:
          rel:
            not:
              enum:
              - via
      - $ref: https://ogcincubator.github.io/bblocks-openscience/build/annotated/osc/prov-examples/geodcat-stac-earthcode/common/schema.yaml#/$defs/via_links
x-jsonld-prefixes:
  acttype: https://w3id.org/ogc/rim/activity-type/
x-bblocks-metadata:
  itemIdentifier: ogc.osc.prov-examples.geodcat-stac-earthcode.workflows
  register: https://ogcincubator.github.io/bblocks-openscience/build/register.json
  version: '0.1'
  dateOfLastChange: '2026-11-23'
