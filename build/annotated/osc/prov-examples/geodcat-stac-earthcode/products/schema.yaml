$schema: https://json-schema.org/draft/2020-12/schema
description: EarthCode Product
allOf:
- $ref: https://ogcincubator.github.io/bblocks-openscience/build/annotated/osc/prov-examples/geodcat-stac-earthcode/common/schema.yaml
- anyOf:
  - $ref: https://ogcincubator.github.io/bblock-prov-schema/build/annotated/ogc-utils/prov-entity/schema.yaml
  - not:
      required:
      - provType
- anyOf:
  - $ref: https://ogcincubator.github.io/bblocks-stac/build/annotated/contrib/stac/extensions/cf/schema.yaml
  - not:
      properties:
        stac_extensions:
          type: array
          contains:
            const: https://stac-extensions.github.io/cf/v1.0.0/schema.json
properties:
  osc:type:
    type: string
    enum:
    - product
  type:
    const: Collection
x-bblocks-metadata:
  itemIdentifier: ogc.osc.prov-examples.geodcat-stac-earthcode.products
  register: https://ogcincubator.github.io/bblocks-openscience/build/register.json
  version: '0.1'
  dateOfLastChange: '2026-11-23'
