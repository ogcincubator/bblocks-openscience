info:
  title: "A sample OGC API - Processes 1.0 implementation"
  version: 1.0.0
  description: |-
    This is a sample implementation of OGC API - Processes 1.0 using Building Blocks.
  contact:
    name: "Open Geospatial Consortium (OGC)"
    email: avillar@ogc.org
    url: 'https://github.com/avillar'
  license:
    name: Apache License, Version 2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0.txt"

servers:
  - description: Example server
    url: http://example.org/ogcapi

paths:
  # This instance only supports one, fixed process (buffer-geometry) instead of the
  # base's generic, templated /processes/{processID} - drop the generic path in favor
  # of the concrete one declared below.
  /processes/{processID}: false
  /processes/{processID}/execution: false

  /processes/buffer-geometry:
    get:
      summary: Get buffer-geometry process description
      description: Retrieves detailed information about the buffer-geometry process
      operationId: getBufferGeometryProcess
      tags:
        - Processes
      responses:
        '200':
          description: Buffer geometry process description
          content:
            application/json:
              schema:
                $ref: bblocks://ogc.osc.api-profiles.processes.sample-implementation.schemas.buffer-geometry.processDescription

  /processes/buffer-geometry/execution:
    post:
      summary: Execute buffer-geometry process
      description: Creates a buffer polygon around a geometry at a specified distance
      operationId: executeBufferGeometry
      tags:
        - Execution
      parameters:
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum:
              - respond-async
              - wait=10
          description: Execution preference (async or sync with timeout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: bblocks://ogc.api.processes.v1.schemas.execute
                - required: [inputs]
                  properties:
                    inputs:
                      $ref: bblocks://ogc.osc.api-profiles.processes.sample-implementation.schemas.buffer-geometry.inputSchema
            example:
              inputs:
                geometry:
                  type: Point
                  coordinates: [ -122.4194, 37.7749 ]
                distance: 1000
                units: meters
      responses:
        '200':
          description: Synchronous execution completed
          content:
            application/json:
              schema:
                properties:
                  outputs:
                    $ref: bblocks://ogc.osc.api-profiles.processes.sample-implementation.schemas.buffer-geometry.outputSchema
        201:
          $ref: "bblocks://ogc.api.processes.v1.responses.ExecuteAsync"
        404:
          $ref: "bblocks://ogc.api.processes.v1.responses.NotFound"
        500:
          $ref: "bblocks://ogc.api.processes.v1.responses.ServerError"

# The base's /, /conformance, /processes, /jobs, /jobs/{jobId} and /jobs/{jobId}/results
# paths are inherited unchanged - the results substitution declared in extensionPoints.
# extensions above (ogc.api.processes.v1.schemas.results ->
# ...schemas.buffer-geometry.outputSchema) is picked up automatically wherever the base
# document uses it, including through /jobs/{jobId}/results' externally-$ref'd Response
# object, with no need to redeclare that path here.
