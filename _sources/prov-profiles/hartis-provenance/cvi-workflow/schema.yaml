$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/hartis-org/cvi-workflow/tree/ospd2026-d100/ospd2026/building-block/_sources/hartis-provenance/cvi-workflow/schema.yaml
title: HARTIS CVI Workflow Provenance
description: >-
  HARTIS profile of the Workflow Provenance Graph (bundle form) for the
  complete CVI workflow. PROV structure, identifiers, provType and
  entityType/activityType come from the PROV building blocks; this schema
  only adds what HARTIS requires: a workflow definition, design-time plans
  with process types, a runtime activity whose steps link to their plans,
  and the entities they use and generate.
allOf:
  - $ref: bblocks://ogc.osc.prov-profiles.workflow-graph
  - $ref: bblocks://ogc.ogc-utils.prov-entity
type: object
required:
  - id
  - provType
  - entityType
  - workflowDefinition
  - plans
  - runtime
  - entities
properties:
  entityType:
    description: The bundle's entityType must include prov:Bundle.
    anyOf:
      - const: prov:Bundle
      - type: array
        contains:
          const: prov:Bundle
  status:
    type: string
  workflowDefinition:
    description: The workflow as a whole, as a PROV Plan.
    allOf:
      - $ref: bblocks://ogc.ogc-utils.prov-entity
    required:
      - id
      - provType
      - entityType
    properties:
      sourceWorkflow:
        type: string
      executionImage:
        type: string
  plans:
    description: Design-time plans, one per processing step.
    type: array
    minItems: 1
    items:
      allOf:
        - $ref: bblocks://ogc.ogc-utils.prov-entity
      required:
        - id
        - provType
        - entityType
        - processType
      properties:
        processType:
          description: The process type this plan describes.
          $ref: bblocks://ogc.ogc-utils.iri-or-curie#/$defs/Single
        sourceCode:
          type: string
  runtime:
    description: The workflow execution as a whole, containing the step activities.
    allOf:
      - $ref: bblocks://ogc.ogc-utils.prov-activity
    required:
      - id
      - provType
      - workflowDefinition
      - activities
    properties:
      workflowDefinition:
        description: Reference to the workflow definition this run executes.
        type: string
      activities:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/activity'
  entities:
    description: Data used and generated by the run.
    type: array
    minItems: 1
    items:
      allOf:
        - $ref: bblocks://ogc.ogc-utils.prov-entity
      required:
        - id
        - provType
$defs:
  activity:
    description: >-
      A runtime step: a Registered Processing Step that names its design-time
      plan and lists its inputs and outputs explicitly.
    allOf:
      - $ref: bblocks://ogc.osc.prov-profiles.processing-step
    required:
      - provType
      - plan
      - used
      - generated
    properties:
      plan:
        description: Reference to the design-time plan this step executes.
        type: string
      used:
        type: array
        minItems: 1
      generated:
        type: array
        minItems: 1
      qualifiedUsage:
        type: array
      wasAssociatedWith:
        type: array
