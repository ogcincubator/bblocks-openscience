- title: Ingest of mandal-level vegetation and soil moisture
  content: >-
    Retrieval of source observations into the workflow. Ingest is where
    external provenance ends and workflow provenance begins: the generated
    entity is the first thing downstream steps can cite.
  snippets:
    - language: json
      ref: examples/ingest.json

- title: Normalisation of vegetation index to a condition index
  content: >-
    Rescaling an observed index against its own historical extremes. The
    reference extrema are inputs rather than inline constants, so the period
    they were derived from is recoverable from the provenance.
  snippets:
    - language: json
      ref: examples/vci-normalisation.json

- title: Normalisation of soil moisture to a deficit index
  content: >-
    The companion to the vegetation index step, and the piece that closes
    the gap in the chain: without it, the combined index consumes an entity
    no recorded activity produced, so a consumer walking the provenance
    backwards hits a dead end.
  snippets:
    - language: json
      ref: examples/smdi-normalisation.json

- title: Weighted composition of a combined drought index
  content: >-
    Combination of two condition indices under fixed weights. Both inputs
    share the same role, and the weights are step parameters rather than
    properties of the process type — a case that bears directly on how
    finely process types should be registered.
  snippets:
    - language: json
      ref: examples/cdsi-composition.json

- title: Classification into drought severity classes
  content: >-
    Assignment of continuous index values to discrete classes. The class
    scheme is an input entity, so the thresholds applied are recoverable
    from the provenance without reading the code.
  snippets:
    - language: json
      ref: examples/drought-classification.json

- title: Standardised precipitation index over an accumulation window
  content: >-
    Derivation of a standardised index from an accumulated series against a
    fitted reference period. Two entities of the same kind distinguished
    only by role — the case where entity references alone would be
    ambiguous and qualifiedUsage does real work.
  snippets:
    - language: json
      ref: examples/spi.json

- title: Model training as a processing step
  content: >-
    Training a predictive model, expressed as an ordinary processing
    activity. The generated entity is a fitted model rather than a data
    product, and the fold assignment is an input entity so the spatial
    cross-validation design is recoverable from the provenance.

    This is the case the profile is least obviously shaped for, and the
    reason it is included: if a trained model cannot be expressed as an
    entity generated by an activity, the profile cannot describe machine
    learning workflows at all.
  snippets:
    - language: json
      ref: examples/model-training.json

- title: Inference using a trained model
  content: >-
    Applying a fitted model to produce a projection. The same model entity
    that was generated by training is here consumed as an input — the
    round trip that makes model provenance chainable, and something no
    purely data-oriented profile has to handle.
  snippets:
    - language: json
      ref: examples/model-inference.json

- title: Minimal conforming step
  content: >-
    The smallest document that satisfies this profile.
  snippets:
    - language: json
      ref: examples/minimal-step.json
