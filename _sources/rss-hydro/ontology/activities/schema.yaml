$schema: https://json-schema.org/draft/2020-12/schema
description: A MoM activity is a processing activity of one of the process types, linked to its register term.
allOf:
  - $ref: bblocks://ogc.osc.rss-hydro.processing-activity
  - $ref: '#/$defs/isMomActivity'
  - required: [processType]
  - if:
      properties:
        activityType:
          enum: [pt:ZonalStatistics, https://w3id.org/ogc/ospd/activity-type/ZonalStatistics]
    then:
      properties:
        processType:
          const: https://w3id.org/ogc/ospd/activity-type/ZonalStatistics
  - if:
      properties:
        activityType:
          enum: [pt:WeightedScoringAndClassification, https://w3id.org/ogc/ospd/activity-type/WeightedScoringAndClassification]
    then:
      properties:
        processType:
          const: https://w3id.org/ogc/ospd/activity-type/WeightedScoringAndClassification
  - if:
      properties:
        activityType:
          enum: [pt:ScoringAndProgressTracking, https://w3id.org/ogc/ospd/activity-type/ScoringAndProgressTracking]
    then:
      properties:
        processType:
          const: https://w3id.org/ogc/ospd/activity-type/ScoringAndProgressTracking
$defs:
  isMomActivity:
    required: [activityType]
    properties:
      activityType:
        description: One of the MoM process types, as a pt CURIE or a full IRI.
        enum:
          - pt:ZonalStatistics
          - https://w3id.org/ogc/ospd/activity-type/ZonalStatistics
          - pt:WeightedScoringAndClassification
          - https://w3id.org/ogc/ospd/activity-type/WeightedScoringAndClassification
          - pt:ScoringAndProgressTracking
          - https://w3id.org/ogc/ospd/activity-type/ScoringAndProgressTracking
